<h2>Ban Users</h2>
<input type="text" placeholder="Search by username or email" [(ngModel)]="searchTerm" (input)="filterUsers()" class="search-box"/>
<table>
    <thead>
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        @for (user of filteredUsers; track user.id) {
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td class="two-buttons">
                    <!-- Ban button should be disabled if the user is already banned -->
                    <button
                        class="ban-btn"
                        [disabled]="user.banned"
                        (click)="banUser(user.id)">
                        Ban User
                    </button>

                    <!-- Unban button should be disabled if the user is not banned -->
                    <button
                        class="un-ban-btn"
                        [disabled]="!user.banned"
                        (click)="unbanUser(user.id)">
                        Unban User
                    </button>
                </td>
            </tr>
        }
    </tbody>
</table>
