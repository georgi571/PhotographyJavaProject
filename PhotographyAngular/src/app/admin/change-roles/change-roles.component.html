<h2>Change User Roles</h2>
<table>
    <thead>
        <tr>
            <th>Username</th>
            <th>Current Role</th>
            <th>New Role</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        @for (user of users; track user.id) {
            <tr>
                <td>{{ user.username }}</td>
                <td>{{ user.role }}</td>
                <td>
                    <select class="role-select" #newRole [disabled]="isUpdating(user.id)">
                        <option value="USER" [selected]="user.role === 'USER'">User</option>
                        <option value="MODERATOR" [selected]="user.role === 'MODERATOR'">Moderator</option>
                        <option value="ADMIN" [selected]="user.role === 'ADMIN'">Admin</option>
                    </select>
                </td>
                <td>
                    <button class="save-role-btn"
                        (click)="saveRole(user.id, newRole.value)"
                        [disabled]="isUpdating(user.id)">
                        {{ isUpdating(user.id) ? 'Saving...' : 'Save' }}
                    </button>
                </td>
            </tr>
        }

    </tbody>
</table>
