<header class="header">
    <div class="logo">
        <a href="/" style="text-decoration: none; color: inherit;">
            <h1>Gamified Photography</h1>
        </a>
    </div>
    <nav class="nav">
        <ul class="nav-links">
            <li><a routerLink="/home" routerLinkActive="active">Home</a></li>
            <li><a routerLink="/challenges" routerLinkActive="active">Challenges</a></li>
            <li><a routerLink="/leaderboards" routerLinkActive="active">Leaderboards</a></li>
            <li><a routerLink="/about" routerLinkActive="active">About Us</a></li>
            <li><a routerLink="/contacts" routerLinkActive="active">Contacts</a></li>
            <li><a routerLink="/admin" routerLinkActive="active">Admin Panel</a></li>
        </ul>
        <ul class="nav-links">
        </ul>
    </nav>
    <div class="join">
        @if (username) {
            <div class="dropdown">
                <span class="dropdown-toggle"> Welcome, {{ username }}</span>
                <ul class="dropdown-menu">
                    <li><a routerLink="/profile" routerLinkActive="active">Profile</a></li>
                    <li><a routerLink="/logout" routerLinkActive="active" (click)="logout()">Logout</a></li>
                </ul>
            </div>
        } @else {
            <a href="/auth" class="btn btn-primary">Join Now</a>
        }
    </div>
</header>
