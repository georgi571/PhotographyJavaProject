<div class="password-section">
    <h3>Change Password</h3>
    @if (errorMessage) {
        <div class="error-message">
            <p>{{ errorMessage }}</p>
        </div>
    }
    <form (ngSubmit)="onSubmitPassword()" #passwordForm="ngForm">
        <div class="form-group">
            <label for="oldPassword">Current Password</label>
            <input
                type="password"
                id="oldPassword"
                name="oldPassword"
                [(ngModel)]="passwordDetails.oldPassword"
                [ngClass]="{'is-invalid': fieldErrors['oldPassword']}"
                required
            />
            @if (fieldErrors['oldPassword']) {
                <div class="error-message">
                    <small>{{ fieldErrors['oldPassword'] }}</small>
                </div>
            }
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                [(ngModel)]="passwordDetails.newPassword"
                [ngClass]="{'is-invalid': fieldErrors['newPassword']}"
                required
            />
            @if (fieldErrors['newPassword']) {
                <div class="error-message">
                    <small>{{ fieldErrors['newPassword'] }}</small>
                </div>
            }
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                [(ngModel)]="passwordDetails.confirmPassword"
                [ngClass]="{'is-invalid': fieldErrors['confirmPassword']}"
                required
            />
            @if (fieldErrors['confirmPassword']) {
                <div class="error-message">
                    <small>{{ fieldErrors['confirmPassword'] }}</small>
                </div>
            }
        </div>

        <button type="submit" [disabled]="!passwordForm.form.valid">Change Password</button>
    </form>
</div>
