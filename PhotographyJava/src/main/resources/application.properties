spring.application.name=PhotographyJava

#Server threads
spring.threads.virtual.enabled=true

#Server
server.tomcat.max-connections=50000
server.tomcat.accept-count=2000
server.tomcat.threads.max=30


#Data Source Properties
spring.datasource.driverClassName = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/gamified_photography?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username = ${db_username}
spring.datasource.password = ${db_password}

#JPA Properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql = TRUE
spring.jpa.hibernate.ddl-auto = update

###Logging Levels
# Disable the default loggers
logging.level.org = WARN
logging.level.blog = WARN

#Show SQL executed with parameter bindings
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor = TRACE

spring.mvc.hiddenmethod.filter.enabled=true

sendinblue.api.key=${SENDINBLUE_API_KEY}

#Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${mail_username}
spring.mail.password=${mail_password}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.startls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Cloudinary Configuration
cloudinary.cloud-name=${cloudinary_cloud_name}
cloudinary.api-key=${cloudinary_apy_key}
cloudinary.api-secret=${cloudinary_api_secret}

jwt.secret=supersecuresecretkeythatmustbelongenough123456

#Kafka Broker running location
spring.kafka.bootstrap-servers=localhost:9092

#JSON Serializer (for sending)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#JSON Deserializer (for receiving)
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id="users"